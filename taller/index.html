<html lang="es">
<head>

<title>Reportes taller</title>
<style>
:root { --bg: #f6f7f9; --fg: #14181f; --muted: #5d6675; --accent: #1f4e9c; }

html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
.wrap { max-width: 640px; margin: 0 auto; padding: 64px 16px; }
h1 { font-size: 26px; margin: 0 0 8px; }
p { color: var(--muted); }
